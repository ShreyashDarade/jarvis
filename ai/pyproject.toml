[project]
name = "jarvis-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websockets>=14", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# Only needed with Windows UI control's screen-reading tool (read_screen); everything else works
# without these. Install with: pip install -e ".[windows-ui]"
windows-ui = ["pywin32>=306", "Pillow>=10", "pytesseract>=0.3.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:randomly"
